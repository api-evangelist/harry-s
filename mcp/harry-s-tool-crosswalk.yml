mcp_only:
- tool: get_cart
  reason: no public read endpoint for a cart; cart state is only reachable through MCP or the buyer's browser session
- tool: update_cart
  reason: >-
    write path with no documented public HTTP equivalent; consolidates line items, buyer
    identity, delivery addresses, delivery option selection, discount and gift-card codes
