note: >-
  Mammoth Brands publishes NO OpenAPI, so the usual MCP-tool -> operationId binding is not
  available. What the brands DO publish is (a) a live anonymous MCP tool set with real input
  schemas, (b) an explicit list of read-only HTTP/JSON storefront endpoints in their own
  agents.md / llms.txt, and (c) a UCP merchant profile naming the capability each surface
  implements. This crosswalk binds those three together. `rest` rows are documented HTTP
  paths, not OpenAPI operationIds — no spec exists to reference and none was invented.
surfaces:
  openapi: null
  openapi_note: no OpenAPI, Swagger, GraphQL or AsyncAPI definition published on any host
  mcp:
  - url: https://www.harrys.com/api/mcp
    gated: false
  - url: https://www.shopflamingo.com/api/mcp
    gated: false
  - url: https://com-harrys-us.myshopify.com/api/ucp/mcp
    gated: true
    reason: agent profile URI required (HTTP 422 invalid_profile_url)
  - url: https://shop-flamingo-us.myshopify.com/api/ucp/mcp
    gated: true
  http_json:
    documented_at: https://www.shopflamingo.com/agents.md
