source: live anonymous MCP tools/list against each brand storefront
note: Mammoth Brands ships no developer-facing API programme, but two of its brands (Harry's and Flamingo)
  run on Shopify and therefore expose a live, anonymous, unauthenticated Model Context Protocol server
  at /api/mcp on their own domains. tools/list was fetched successfully on 2026-07-31 and the verbatim
  responses are saved alongside this manifest, so every tool below carries the provider's REAL inputSchema.
  A second, UCP-branded MCP endpoint is advertised in each store's /.well-known/ucp.json but requires
  an agent profile URI and is therefore gated.
