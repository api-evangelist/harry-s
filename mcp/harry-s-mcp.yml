tools:
- name: search_catalog
  description: Search for products from the online store. Accepts natural-language queries, specific filter
    criteria, or both; at least one of query or filters must be provided. Results are paginated via pagination.cursor.
    Response conforms to the UCP catalog search capability (dev.ucp.shopping.catalog.search).
  input_properties:
  - meta
  - catalog
  servers:
  - harrys-storefront
  - flamingo-storefront
- name: get_product_details
  description: Look up a product by ID. Pass the options parameter to select a specific variant for the
    product card; without options the first available variant is returned.
  input_properties:
  - product_id
  - options
  - country
  - language
  required:
  - product_id
  servers:
  - harrys-storefront
  - flamingo-storefront
- name: get_cart
  description: Get the cart including items, shipping options, discount info, and checkout url for a given
    cart id.
  input_properties:
  - cart_id
  required:
  - cart_id
  servers:
  - harrys-storefront
  - flamingo-storefront
- name: update_cart
  description: Perform updates to a cart in one consolidated call — adding/removing/updating line items,
    buyer information, shipping details, discount codes, gift cards and notes. Shipping options become
    available after adding a delivery address.
  input_properties:
  - cart_id
  - add_items
  - update_items
  - remove_line_ids
  - buyer_identity
  - delivery_addresses_to_add
  - delivery_addresses_to_replace
  - selected_delivery_options
  - discount_codes
  - gift_card_codes
  - note
  servers:
  - harrys-storefront
  - flamingo-storefront
- name: search_shop_policies_and_faqs
  description: Get facts about the store's policies, products, or services — return policy, shipping policy,
    contact details, hours.
  input_properties:
  - query
  - context
  required:
  - query
  servers:
  - harrys-storefront
  - flamingo-storefront
