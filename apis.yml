- name: Flamingo Storefront MCP Server
  description: 'Anonymous Model Context Protocol server exposed by the Flamingo storefront at
    /api/mcp, with the same five-tool surface as Harry''s. Flamingo additionally publishes an
    llms.txt and an agents.md describing the UCP agent flow, the read-only storefront JSON
    endpoints, the per-IP rate limiting, and the rule that checkout requires explicit human
    approval.'
