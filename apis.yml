apis:
- name: Harry's Storefront MCP Server
  description: 'Anonymous Model Context Protocol server exposed by the Harry''s storefront at
    /api/mcp. Five tools — search_catalog, get_product_details, get_cart, update_cart and
    search_shop_policies_and_faqs — each with a real published inputSchema. Protocol version
    2025-06-18; no authentication required. Responses conform to the UCP catalog capabilities
    declared in the store''s /.well-known/ucp.json.'
  humanURL: https://www.harrys.com/
  baseURL: https://www.harrys.com/api/mcp
