aid: harry-s
name: Mammoth Brands
description: 'Mammoth Brands is the consumer packaged goods company formerly known as Harry''s
  Inc., renamed in April 2025 to reflect a portfolio that now spans Harry''s (men''s shaving
  and grooming), Flamingo (women''s hair removal and body care), Lume and Mando (whole-body
  deodorant) and Coterie (modern baby care). Founded in 2013 by Jeff Raider and Andy
  Katz-Mayfield and still privately held, it reported $835M in 2024 revenue. It runs no
  developer programme and publishes no OpenAPI, but two of its brands operate on Shopify and
  therefore expose a live, anonymous Model Context Protocol server plus a Universal Commerce
  Protocol merchant profile on their own domains — a real agentic-commerce surface with no
  documentation portal behind it.'
